<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Docs - Assignment Workspace</title>
    <link rel="icon" type="image/x-icon" href="https://gstatic.com">
    <style>
        body { margin: 0; overflow: hidden; background-color: #030305; font-family: monospace; user-select: none; }
        #hud-overlay { position: absolute; top: 20px; left: 20px; color: #a0aec0; background: rgba(0,0,0,0.7); padding: 8px 14px; border-radius: 4px; font-size: 11px; letter-spacing: 1px; pointer-events: none; z-index: 10; border: 1px solid #222; }
    </style>
</head>
<body>

    <div id="hud-overlay">🛡️ 3D RUNTIME ACTIVE | MOVE MOUSE TO LOOK | WASD TO WALK | TAP ` TO KILL TAB</div>

    <!-- Core 3D Graphics Library -->
    <script src="https://cloudflare.com"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020204);
        scene.fog = new THREE.FogExp2(0x020204, 0.07); 

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        document.body.appendChild(renderer.domElement);

        // Ground Floor Environment
        const floorGeo = new THREE.PlaneGeometry(500, 500);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f0f12, roughness: 0.85 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        // Procedural Concrete Wall Pillars
        const wallGeo = new THREE.BoxGeometry(2, 6, 2);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x1c1c22, roughness: 0.9 });
        for (let i = 0; i < 40; i++) {
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set((Math.random() - 0.5) * 120, 3, (Math.random() - 0.5) * 120);
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
        }

        // --- 3D SURVIVOR RIG (JOEL OVER-THE-SHOULDER NODE) ---
        const playerPivot = new THREE.Group();
        const playerMesh = new THREE.Group();
        playerPivot.add(playerMesh);
        scene.add(playerPivot);

        // Character Core Capsule
        const bodyGeo = new THREE.CylinderGeometry(0.35, 0.35, 1.8, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x242b35, roughness: 0.7 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.9;
        body.castShadow = true;
        playerMesh.add(body);

        // Facing Direction Visor Indicator
        const visorGeo = new THREE.BoxGeometry(0.2, 0.15, 0.3);
        const visorMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
        const visor = new THREE.Mesh(visorGeo, visorMat);
        visor.position.set(0, 1.4, -0.25);
        playerMesh.add(visor);

        // --- FLASHBEAM LIGHT SOURCES ---
        const ambientLight = new THREE.AmbientLight(0x040408, 0.6);
        scene.add(ambientLight);

        const flashlight = new THREE.SpotLight(0xfff5e6, 18, 45, Math.PI / 6.5, 0.5, 1);
        flashlight.position.set(0.2, 1.2, -0.2); 
        flashlight.castShadow = true;
        flashlight.shadow.mapSize.width = 1024;
        flashlight.shadow.mapSize.height = 1024;
        
        const lightTarget = new THREE.Object3D();
        scene.add(lightTarget);
        flashlight.target = lightTarget;
        playerMesh.add(flashlight);
        // --- CLICK-FREE INTERACTIVE MOUSE LOOK MAPPING ---
        let yaw = 0, pitch = 0;
        
        window.addEventListener('mousemove', (e) => {
            // Track the mouse coordinates relative to the window screen directly without clicking
            const deltaX = (e.clientX - window.innerWidth / 2) * 0.005;
            const deltaY = (e.clientY - window.innerHeight / 2) * 0.005;

            yaw = -deltaX;
            pitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, -deltaY)); // Look boundaries
            
            playerPivot.rotation.y = yaw;
        });

        // Movement Keyboard Inputs
        const input = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() in input) input[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { if (e.key.toLowerCase() in input) input[e.key.toLowerCase()] = false; });

        const playerSpeed = 0.12;

        function renderEngineFrame() {
            requestAnimationFrame(renderEngineFrame);

            let moveX = 0, moveZ = 0;
            if (input.w) moveZ -= 1;
            if (input.s) moveZ += 1;
            if (input.a) moveX -= 1;
            if (input.d) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
                const dir = new THREE.Vector3(moveX / length, 0, moveZ / length);
                // Align step coordinates to camera direction facing matrices
                dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                playerPivot.position.addScaledVector(dir, playerSpeed);
            }

            // Lock flashlight direction vectors straight ahead
            lightTarget.position.set(
                playerPivot.position.x - Math.sin(yaw) * 15,
                playerPivot.position.y + 1.2 + Math.sin(pitch) * 10,
                playerPivot.position.z - Math.cos(yaw) * 15
            );

            // Over-The-Shoulder Cinematic Camera Placement
            const cameraOffset = new THREE.Vector3(0.8, 3.2, 5.0); 
            cameraOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            const targetCamPos = playerPivot.position.clone().add(cameraOffset);
            camera.position.lerp(targetCamPos, 0.08); // Smooth movement lag
            
            const lookTarget = playerPivot.position.clone().add(new THREE.Vector3(-Math.sin(yaw) * 4, 1.2, -Math.cos(yaw) * 4));
            camera.lookAt(lookTarget);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        renderEngineFrame();
    </script>
</body>
</html>
