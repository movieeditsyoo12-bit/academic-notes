<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 04A - Side-Perspective Depth Engine</title>
    <style>
        body { margin: 0; padding: 0; background-color: #030305; overflow: hidden; font-family: monospace; user-select: none; }
        canvas { display: block; width: 100%; height: 100vh; background-color: #050508; }
        #hud-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(7, 8, 12, 0.95);
            border: 1px solid #1e293b;
            padding: 12px 24px;
            border-radius: 6px;
            pointer-events: none;
        }
        .inventory-slot { text-align: center; color: #94a3b8; font-size: 11px; letter-spacing: 1px; }
        .inventory-count { font-size: 18px; font-weight: bold; color: #f1f5f9; margin-top: 2px; }
        #info-banner { position: absolute; top: 15px; left: 15px; color: #64748b; background: rgba(5,5,8,0.92); padding: 8px 14px; border-radius: 4px; font-size: 11px; border: 1px solid #1e293b; pointer-events: none; }
        #loot-alert { position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%); color: #fbbf24; font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.85); padding: 6px 16px; border-radius: 4px; border: 1px solid #d97706; display: none; pointer-events: none; }
    </style>
</head>
<body>

    <div id="info-banner">⚙️ SIDE-PERSPECTIVE DEPTH ENGINE | WASD: MOVE (W/S moves depth into background) | AIM: MOUSE</div>
    <div id="loot-alert">📦 SEARCHING COLD STORAGE SUPPLY CRATE...</div>

    <div id="hud-container">
        <div class="inventory-slot">BLADES<div id="inv-blades" class="inventory-count">0</div></div>
        <div class="inventory-slot">BINDINGS<div id="inv-bindings" class="inventory-count">0</div></div>
        <div class="inventory-slot">ALCOHOL<div id="inv-alcohol" class="inventory-count">0</div></div>
        <div class="inventory-slot">RAGS<div id="inv-rags" class="inventory-count">0</div></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let inventory = { blades: 0, bindings: 0, alcohol: 0, rags: 0 };
        let cameraX = 0;

        let player = { 
            x: 300, 
            y: 450, 
            zDepth: 0, 
            w: 24, 
            h: 54, 
            speed: 3.5, 
            facing: 1, 
            walkCycle: 0, 
            isMoving: false 
        };
        
        let mouse = { x: 0, y: 0 };
        let keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        // Procedural environmental generation data vectors
        let entities = [];
        for (let i = 0; i < 25; i++) {
            let worldX = Math.random() * 4000;
            let depthZone = Math.random() * 120 - 60;
            entities.push({
                type: 'wall',
                worldX: worldX,
                zDepth: depthZone,
                w: Math.random() * 60 + 40,
                h: Math.random() * 100 + 80, 
                color: ['#1e293b', '#27272a', '#111827'][Math.floor(Math.random() * 3)]
            });
        }
        for (let i = 0; i < 15; i++) {
            entities.push({
                type: 'crate',
                worldX: Math.random() * 3800 + 100,
                zDepth: Math.random() * 100 - 50,
                w: 22,
                h: 22,
                looted: false,
                lootProgress: 0,
                lootType: ['blades', 'bindings', 'alcohol', 'rags'][Math.floor(Math.random() * 4)]
            });
        }

        window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });
        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        function checkCollision(targetWorldX, targetZ) {
            for (let ent of entities) {
                if (ent.type === 'wall') {
                    if (targetWorldX + player.w/2 > ent.worldX && targetWorldX - player.w/2 < ent.worldX + ent.w &&
                        targetZ + 15 > ent.zDepth && targetZ - 15 < ent.zDepth) {
                        return true;
                    }
                }
            }
            return false;
        }

        function update() {
            let nextWorldX = player.x;
            let nextZ = player.zDepth;
            player.isMoving = false;

            if (keys.a || keys.ArrowLeft) { nextWorldX -= player.speed; player.facing = -1; player.isMoving = true; }
            if (keys.d || keys.ArrowRight) { nextWorldX += player.speed; player.facing = 1; player.isMoving = true; }
            if (keys.w || keys.ArrowUp) { nextZ -= player.speed * 0.6; player.isMoving = true; } 
            if (keys.s || keys.ArrowDown) { nextZ += player.speed * 0.6; player.isMoving = true; } 

            if (!checkCollision(nextWorldX, player.zDepth) && nextWorldX > 50) player.x = nextWorldX;
            if (!checkCollision(player.x, nextZ) && nextZ > -70 && nextZ < 70) player.zDepth = nextZ;

            if (player.isMoving) player.walkCycle += 0.25;
            else player.walkCycle = 0;

            cameraX = player.x - canvas.width / 2;

            let alertBox = document.getElementById('loot-alert');
            let nearCrate = false;

            for (let ent of entities) {
                if (ent.type === 'crate' && !ent.looted) {
                    let distance = Math.sqrt(Math.pow(player.x - ent.worldX, 2) + Math.pow(player.zDepth - ent.zDepth, 2));
                    if (distance < 40) {
                        nearCrate = true;
                        ent.lootProgress += 1.5;
                        alertBox.style.display = 'block';
                        alertBox.innerText = `📦 SALVAGING SUPPLY CONTAINER... [${Math.floor(ent.lootProgress)}%]`;

                        if (ent.lootProgress >= 100) {
                            ent.looted = true;
                            inventory[ent.lootType] += Math.floor(Math.random() * 2) + 1;
                            document.getElementById(`inv-${ent.lootType}`).innerText = inventory[ent.lootType];
                            alertBox.style.display = 'none';
                        }
                        break;
                    }
                }
            }
            if (!nearCrate) alertBox.style.display = 'none';
        }
        function draw() {
            ctx.fillStyle = '#040407';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 450 - 75, canvas.width, 150);

            let renderList = [...entities];
            renderList.push({
                type: 'player',
                worldX: player.x,
                zDepth: player.zDepth
            });
            renderList.sort((a, b) => a.zDepth - b.zDepth);

            for (let item of renderList) {
                let screenX = item.worldX - cameraX;
                let screenY = 450 + item.zDepth; 

                if (item.type === 'wall') {
                    ctx.fillStyle = item.color;
                    ctx.fillRect(screenX, screenY - item.h, item.w, item.h);
                    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(screenX, screenY - item.h, item.w, item.h);
                } 
                else if (item.type === 'crate' && !item.looted) {
                    ctx.fillStyle = '#b45309';
                    ctx.fillRect(screenX, screenY - item.h, item.w, item.h);
                    ctx.strokeStyle = `rgba(251, 191, 36, ${0.4 + Math.sin(Date.now() * 0.008) * 0.4})`;
                    ctx.strokeRect(screenX - 2, screenY - item.h - 2, item.w + 4, item.h + 4);
                } 
                else if (item.type === 'player') {
                    ctx.save();
                    ctx.translate(screenX, screenY);

                    let dx = mouse.x - screenX;
                    let dy = mouse.y - (screenY - 35);
                    let aimAngle = Math.atan2(dy, dx);

                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(0, -35); 
                    ctx.arc(0, -35, 380, aimAngle - 0.35, aimAngle + 0.35);
                    ctx.closePath();
                    let flashGrad = ctx.createRadialGradient(0, -35, 5, 0, -35, 380);
                    flashGrad.addColorStop(0, 'rgba(255, 245, 210, 0.55)');
                    flashGrad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = flashGrad; ctx.fill();
                    ctx.restore();

                    let legSwing = Math.sin(player.walkCycle) * 10;
                    ctx.fillStyle = '#1c1917'; 
                    ctx.fillRect(-6 + legSwing, -10, 5, 10);
                    ctx.fillRect(1 - legSwing, -10, 5, 10);

                    ctx.fillStyle = '#1e3a5f'; 
                    ctx.fillRect(-8, -42, 16, 32);
                    ctx.fillStyle = '#3f3f46'; 
                    ctx.fillRect(-7, -40, 14, 20);

                    ctx.fillStyle = '#e4e4e7'; 
                    ctx.fillRect(-5, -53, 10, 11);
                    ctx.fillStyle = '#27272a'; 
                    ctx.fillRect(-6, -55, 12, 4);

                    ctx.translate(0, -32);
                    ctx.rotate(aimAngle);
                    ctx.fillStyle = '#09090b'; 
                    ctx.fillRect(0, -2, 24, 4);
                    ctx.fillStyle = '#f4f4f5'; 
                    ctx.fillRect(18, -4, 4, 2);

                    ctx.restore();
                }
            }

            let vignette = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.width/3, canvas.width/2, canvas.height/2, canvas.width/1.1);
            vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
            vignette.addColorStop(1, 'rgba(1, 1, 2, 0.95)');
            ctx.fillStyle = vignette; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
</html>
