<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 04A - Array Map Renderer</title>
    <style>
        body { margin: 0; padding: 0; background-color: #050508; overflow: hidden; font-family: monospace; user-select: none; }
        canvas { display: block; width: 100%; height: 100vh; background-color: #07070b; }
        #hud { position: absolute; top: 15px; left: 15px; color: #8e9aa8; background: rgba(10,10,15,0.85); padding: 8px 12px; border-radius: 4px; font-size: 11px; border: 1px solid #1e293b; pointer-events: none; }
    </style>
</head>
<body>

    <div id="hud">📦 GRAPH ENGINE RUNNING | WALK: WASD / ARROWS | AIM: MOVE MOUSE</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas to full screen size inside the frame container
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game State Variables
        let player = { x: canvas.width / 2, y: canvas.height / 2, size: 14, speed: 3.5, angle: 0 };
        let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        let keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        // Generate static post-apocalyptic obstacles/ruins
        let obstacles = [];
        for (let i = 0; i < 20; i++) {
            obstacles.push({
                x: Math.random() * (window.innerWidth - 100) + 50,
                y: Math.random() * (window.innerHeight - 100) + 50,
                w: Math.random() * 40 + 20,
                h: Math.random() * 40 + 20
            });
        }

        // Input Trackers (Completely click-free)
        window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });
        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        // Simple AABB Collision Detection Rule
        function checkCollision(px, py, size) {
            for (let obs of obstacles) {
                if (px + size > obs.x && px - size < obs.x + obs.w &&
                    py + size > obs.y && py - size < obs.y + obs.h) {
                    return true;
                }
            }
            return false;
        }

        // Main Physics Update Loops
        function update() {
            let nextX = player.x;
            let nextY = player.y;

            if (keys.w || keys.ArrowUp) nextY -= player.speed;
            if (keys.s || keys.ArrowDown) nextY += player.speed;
            if (keys.a || keys.ArrowLeft) nextX -= player.speed;
            if (keys.d || keys.ArrowRight) nextX += player.speed;

            // Apply movement borders and block wall collisions
            if (!checkCollision(nextX, player.y, player.size) && nextX > player.size && nextX < canvas.width - player.size) {
                player.x = nextX;
            }
            if (!checkCollision(player.x, nextY, player.size) && nextY > player.size && nextY < canvas.height - player.size) {
                player.y = nextY;
            }

            // Calculate rotation angle tracking the mouse cursor
            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        }

        // Tactical 2D Flashlight Raycasting Render Pipeline
        function draw() {
            // 1. Reset dark apocalypse background canvas
            ctx.fillStyle = '#06060a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Draw The Tactical Flashlight Cone (The Last of Us ambiance)
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            // Flashlight properties: 35-degree beam angle, spreading out 260 pixels
            ctx.arc(player.x, player.y, 260, player.angle - 0.35, player.angle + 0.35);
            ctx.closePath();
            
            // Create a realistic flashlight beam drop-off gradient shadow
            let lightGradient = ctx.createRadialGradient(player.x, player.y, 10, player.x, player.y, 260);
            lightGradient.addColorStop(0, 'rgba(255, 248, 220, 0.45)');
            lightGradient.addColorStop(0.6, 'rgba(255, 248, 220, 0.15)');
            lightGradient.addColorStop(1, 'rgba(255, 248, 220, 0)');
            
            ctx.fillStyle = lightGradient;
            ctx.fill();
            ctx.restore();

            // 3. Draw Ruined Obstacles / Barriers
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
            }

            // 4. Draw Player Character Template (Tactical Survivor Circle + Weapon Indicator)
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);

            // Draw player outer ring body
            ctx.beginPath();
            ctx.arc(0, 0, player.size, 0, Math.PI * 2);
            ctx.fillStyle = '#38bdf8'; // Tactical Cyan/Blue
            ctx.strokeStyle = '#0284c7';
            ctx.lineWidth = 3;
            ctx.fill();
            ctx.stroke();

            // Draw flashlight/weapon aiming handle direction indicator
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(6, -3, 8, 6);
            ctx.restore();
        }

        // Loop Runner Automation Setup
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
