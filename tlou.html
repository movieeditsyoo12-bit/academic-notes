<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Matrix Sandbox Layer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #030306;
            font-family: monospace;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            border: 1px solid rgba(0, 0, 0, 0.4);
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #94a3b8;
            background: rgba(10, 11, 16, 0.85);
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 11px;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 10;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <div id="hud">⚙️ 3D SYSTEM ONLINE | WALKING: WASD | LOOK: DRAG MOUSE (NO CLICK LOCKS REQUIRED)</div>
    <div id="crosshair"></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let player = { x: 0, y: 1.2, z: 0, yaw: 0, pitch: 0, speed: 0.12 };
        let input = { w: false, a: false, s: false, d: false };
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        let pillars = [];
        for(let i=0; i<45; i++) {
            pillars.push({
                x: (Math.random() - 0.5) * 80,
                z: (Math.random() - 0.5) * 80,
                r: Math.random() * 1.5 + 1.0, 
                h: Math.random() * 6.0 + 4.0  
            });
        }
        window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() in input) input[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { if (e.key.toLowerCase() in input) input[e.key.toLowerCase()] = false; });
        
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            
            player.yaw = ((mouse.x / window.innerWidth) * Math.PI * 2.5) - (Math.PI * 1.25);
            player.pitch = ((mouse.y / window.innerHeight) - 0.5) * -0.8; 
        });

        function updatePhysics() {
            let forwardX = -Math.sin(player.yaw);
            let forwardZ = -Math.cos(player.yaw);
            let rightX = -Math.sin(player.yaw - Math.PI/2);
            let rightZ = -Math.cos(player.yaw - Math.PI/2);

            if (input.w) { player.x += forwardX * player.speed; player.z += forwardZ * player.speed; }
            if (input.s) { player.x -= forwardX * player.speed; player.z -= forwardZ * player.speed; }
            if (input.a) { player.x += rightX * player.speed; player.z += rightZ * player.speed; }
            if (input.d) { player.x -= rightX * player.speed; player.z -= rightZ * player.speed; }
        }
        function renderHighPolyFrame() {
            let horizonY = canvas.height / 2 + (player.pitch * (canvas.height / 2));
            
            ctx.fillStyle = '#030306';
            ctx.fillRect(0, 0, canvas.width, horizonY);
            ctx.fillStyle = '#0b0c10';
            ctx.fillRect(0, horizonY, canvas.width, canvas.height);

            let visibleQueue = [];

            for (let pil of pillars) {
                let dx = pil.x - player.x;
                let dz = pil.z - player.z;

                let rotX = dx * Math.cos(player.yaw) - dz * Math.sin(player.yaw);
                let rotZ = dx * Math.sin(player.yaw) + dz * Math.cos(player.yaw);

                if (rotZ <= 0.1) continue;

                let focalScale = (canvas.height * 0.8) / rotZ;
                let screenX = (canvas.width / 2) + (rotX * focalScale);
                let baseScreenY = horizonY + ((player.y) * focalScale);
                let topScreenY = horizonY - ((pil.h - player.y) * focalScale);

                let radiusWidth = pil.r * focalScale;

                visibleQueue.push({
                    sz: rotZ, x: screenX, botY: baseScreenY, topY: topScreenY, rad: radiusWidth
                });
            }

            visibleQueue.sort((a, b) => b.sz - a.sz);

            for (let obj of visibleQueue) {
                let fogFactor = Math.min(1.0, obj.sz / 55);
                let baseShade = Math.floor(35 * (1.0 - fogFactor));

                let centerOffsetAngle = Math.abs(obj.x - canvas.width / 2);
                let torchIntensity = 0;
                if (centerOffsetAngle < (obj.rad + 140) && obj.sz < 24) {
                    torchIntensity = (1.0 - (centerOffsetAngle / (obj.rad + 140))) * (1.0 - (obj.sz / 24)) * 95;
                }

                let finalRGB = Math.floor(baseShade + torchIntensity);
                ctx.fillStyle = `rgb(${finalRGB * 0.8}, ${finalRGB * 0.85}, ${finalRGB * 1.05})`;
                ctx.fillRect(obj.x - obj.rad / 2, obj.topY, obj.rad, obj.botY - obj.topY);
                
                ctx.strokeStyle = `rgba(255,255,255,${0.04 * (1.0 - fogFactor)})`;
                ctx.lineWidth = 1;
                ctx.strokeRect(obj.x - obj.rad / 2, obj.topY, obj.rad, obj.botY - obj.topY);
            }

            // --- SMOOTH UNREAL STYLE MANNEQUIN CHARACTER OVER-THE-SHOULDER RENDER ---
            ctx.save();
            ctx.translate(canvas.width * 0.68, canvas.height * 0.74);

            ctx.fillStyle = '#1c1d22'; ctx.fillRect(-22, -10, 12, 34);

            let torsoGradient = ctx.createLinearGradient(-15, 0, 20, 0);
            torsoGradient.addColorStop(0, '#1e293b'); torsoGradient.addColorStop(1, '#334155');
            ctx.fillStyle = torsoGradient;
            ctx.beginPath(); ctx.arc(0, 10, 28, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#475569';
            ctx.beginPath(); ctx.arc(-26, -5, 11, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(26, -5, 11, 0, Math.PI * 2); ctx.fill();

            let headGradient = ctx.createRadialGradient(-2, -35, 2, 0, -35, 16);
            headGradient.addColorStop(0, '#f8fafc'); headGradient.addColorStop(1, '#cbd5e1');
            ctx.fillStyle = headGradient;
            ctx.beginPath(); ctx.arc(0, -35, 17, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#0f172a'; ctx.fillRect(16, -20, 12, 50);
            ctx.fillStyle = '#e2e8f0'; ctx.fillRect(20, -25, 4, 6);

            ctx.restore();

            let vignette = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.width/4, canvas.width/2, canvas.height/2, canvas.width/1.1);
            vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(0.5, 'rgba(2, 2, 5, 0.3)'); vignette.addColorStop(1, 'rgba(1, 1, 2, 0.96)');
            ctx.fillStyle = vignette; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function mainEngineLoop() {
            updatePhysics();
            renderHighPolyFrame();
            requestAnimationFrame(mainEngineLoop);
        }

        mainEngineLoop();
    </script>
</body>
</html>
