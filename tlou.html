<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Plane System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020204; font-family: sans-serif; user-select: none; }
        #hud { position: absolute; top: 15px; left: 15px; color: #fff; background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 4px; font-size: 12px; border: 1px solid #333; pointer-events: none; }
    </style>
</head>
<body>

    <div id="hud">⚡ VECTOR RUNTIME RUNNING | WALKING: WASD or Arrows</div>

    <script src="https://cloudflare.com"></script>

    <script>
        // --- WebGL Core ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020204);
        scene.fog = new THREE.FogExp2(0x020204, 0.08);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Fixed Top-Down Over-the-shoulder angle (Bypasses clicking/mouse restrictions completely)
        camera.position.set(0, 12, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- Ground Plane ---
        const floorGeo = new THREE.PlaneGeometry(300, 300);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- Scattered Post-Apocalyptic Pillars ---
        const pillarGeo = new THREE.BoxGeometry(1.2, 5, 1.2);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x1c1c22, roughness: 1.0 });
        for (let i = 0; i < 30; i++) {
            const pillar = new THREE.Mesh(pillarGeo, pillarMat);
            pillar.position.set((Math.random() - 0.5) * 60, 2.5, (Math.random() - 0.5) * 60);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            scene.add(pillar);
        }

        // --- Survival Capsule Character ---
        const player = new THREE.Group();
        scene.add(player);

        const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.8, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x242b35, roughness: 0.6 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.9;
        body.castShadow = true;
        player.add(body);

        // Facing indicator
        const visorGeo = new THREE.BoxGeometry(0.2, 0.2, 0.4);
        const visorMat = new THREE.MeshBasicMaterial({ color: 0x0a0a0a });
        const visor = new THREE.Mesh(visorGeo, visorMat);
        visor.position.set(0, 1.4, -0.3);
        player.add(visor);

        // --- Atmospheric Lighting & Flashlight ---
        const ambientLight = new THREE.AmbientLight(0x040408, 1.2);
        scene.add(ambientLight);

        const flashlight = new THREE.SpotLight(0xfff5e6, 18, 35, Math.PI / 6, 0.5, 1);
        flashlight.position.set(0, 1.2, -0.2);
        flashlight.castShadow = true;
        
        const lightTarget = new THREE.Object3D();
        scene.add(lightTarget);
        flashlight.target = lightTarget;
        player.add(flashlight);

        // --- Simple Direct Movement Inputs ---
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

        const speed = 0.12;

        function loop() {
            requestAnimationFrame(loop);

            let mx = 0;
            let mz = 0;

            if (keys.w || keys.ArrowUp) mz -= 1;
            if (keys.s || keys.ArrowDown) mz += 1;
            if (keys.a || keys.ArrowLeft) mx -= 1;
            if (keys.d || keys.ArrowRight) mx += 1;

            if (mx !== 0 || mz !== 0) {
                const length = Math.sqrt(mx * mx + mz * mz);
                const dx = (mx / length) * speed;
                const dz = (mz / length) * speed;

                player.position.x += dx;
                player.position.z += dz;

                // Turn the player mesh instantly toward the movement vectors
                player.rotation.y = Math.atan2(dx, dz);
            }

            // Lock flashlight to cast directly forward wherever character steps
            lightTarget.position.set(
                player.position.x - Math.sin(player.rotation.y) * 10,
                0.5,
                player.position.z - Math.cos(player.rotation.y) * 10
            );

            // Camera smoothly locks onto player positions from above
            camera.position.set(player.position.x, player.position.y + 11, player.position.z + 9);
            camera.lookAt(player.position.x, player.position.y, player.position.z - 2);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        loop();
    </script>
</body>
</html>
