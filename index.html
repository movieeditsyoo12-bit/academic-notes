<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Unit 4 Trigonometric Functions</title>
    <link rel="icon" type="image/x-icon" href="https://gstatic.com">
    <style>
        body { font-family: "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; color: #202124; user-select: none; }
        .navbar { background-color: #fff; border-bottom: 1px solid #dadce0; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .nav-title { font-size: 18px; font-weight: 500; color: #3c4043; }
        .nav-info { font-size: 14px; color: #70757a; }
        .container { max-width: 1000px; margin: 30px auto; background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 40px; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3); }
        h1 { font-size: 24px; font-weight: 400; margin-top: 0; border-bottom: 1px solid #e8eaed; padding-bottom: 15px; }
        .question-box { margin-bottom: 30px; font-size: 16px; }
        .math-equation { font-family: "Times New Roman", serif; font-style: italic; background: #f1f3f4; padding: 4px 8px; border-radius: 4px; }
        .interactive-module-box { border: 2px dashed #1a73e8; background-color: #f8f9fa; border-radius: 6px; padding: 15px; margin: 20px 0; }
        .module-header { font-size: 14px; font-weight: bold; color: #1a73e8; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .btn-tool { background-color: #1a73e8; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 500; margin-right: 5px; }
        .btn-tool:hover { background-color: #1557b0; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-title">📐 Advanced Trigonometry Sandbox</div>
        <div class="nav-info">Student ID: Guest_Session_Active</div>
    </div>

    <div class="container">
        <h1>Assessment 04B: Matrix Plane Transformations</h1>
        
        <div class="question-box">
            <p><strong>Question 1:</strong> Calculate the vector translation amplitude given the baseline function environment coordinate array below:</p>
            <p class="math-equation">f(x) = 2sin(3x - π/2) + 4</p>
        </div>

        <div class="interactive-module-box">
            <div class="module-header">
                <span>📊 Interactive Vector Sandbox Module v4.5</span>
                <div>
                    <!-- Unblockable Stream Launch Technique -->
                    <button class="btn-tool" style="background:#2ea44f;" onclick="streamGame('tlou.html')">Launch 3D Simulation Frame (TLOU)</button>
                    <button class="btn-tool" style="background:#5f6368;" onclick="streamGame('flappy.html')">Launch 2D Vector Workspace (Flappy)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function streamGame(fileName) {
            // Open an invisible blank tab container that extensions can't track
            const secureWindow = window.open('about:blank', '_blank');
            
            fetch(fileName + "?cb=" + new Date().getTime())
                .then(res => res.text())
                .then(code => {
                    // Inject an emergency kill script into the tab stream
                    const panicTrigger = `
                        <script>
                            document.addEventListener('keydown', function(e) {
                                if (e.key === '\`') {
                                    window.close(); // Immediate hard close
                                }
                            });
                        <\/script>
                    `;
                    secureWindow.document.write(code + panicTrigger);
                    secureWindow.document.close();
                })
                .catch(err => {
                    window.location.href = fileName;
                });
        }

        // Dashboard emergency redirect mirror
        document.addEventListener('keydown', function(e) {
            if (e.key === '`') window.location.replace('https://google.com');
        });
    </script>
</body>
</html>
